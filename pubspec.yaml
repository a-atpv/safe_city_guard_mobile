name: safe_city_guard_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html

# Номер сборки (то, что после «+») обязан только РАСТИ — Android отказывается
# ставить APK с versionCode меньше установленного, и Play отвергает загрузку.
# Здесь он был `+2`, притом что в закрытом тестировании уже лежит 1.0.9, а CI
# выпускал 101 и 102: сборка с `+2` не встала бы ни на один телефон, где
# приложение уже стоит. Отсюда прыжок на 120 — с запасом над всем, что уехало;
# терять номера не страшно, важна только монотонность.
#
# Имя версии — следующее за тем, что в сторе (1.0.9). Разводить его важно не для
# красоты: баннер «вышло обновление» сравнивает именно имя
# (APP_GUARD_LATEST_VERSION на бэкенде), и пока «свежая» и «глухая» сборки
# назывались одинаково, он не мог сработать. Не откатывать.
version: 1.0.11+15

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.1
  flutter_riverpod: ^3.2.0
  go_router: ^17.0.0
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.2
  state_notifier: ^1.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  pinput: ^5.0.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  geolocator: ^13.0.0
  url_launcher: ^6.2.5
  package_info_plus: ^9.0.0
  http: ^1.2.1
  web_socket_channel: ^3.0.1
  flutter_ringtone_player: ^4.0.0+4
  vibration: ^2.0.1
  # path_provider больше не наша прямая зависимость: сирену во временный файл
  # раскладывает сам flutter_ringtone_player (он и тянет path_provider), а мы
  # передаём ему ассет через fromAsset — см. SosSiren.startInApp.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  # First-person turn-by-turn navigation (Path B: free stack)
  maplibre_gl: ^0.21.0 # vector map with camera pitch/bearing for the first-person view
  flutter_tts: ^4.2.0 # spoken turn instructions

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  # Match dark navy from the logo background for Android adaptive icon edges
  adaptive_icon_background: "#0D1530"
  adaptive_icon_foreground: assets/app_icon.png

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/sounds/
